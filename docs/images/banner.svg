<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">palace</title>
  <desc id="desc">palace banner: decisions, fixes, and preferences from today's session are stored in a local palace, so the agent's next session remembers them. Tagline: local-first memory for coding agents.</desc>
  <style>
    .bg { fill: #f6f8fa; }
    .ink { fill: #1f2328; }
    .muted { fill: #57606a; }
    .line { stroke: #8c959f; }
    .chip { fill: #ffffff; stroke: #d0d7de; }
    .accent { fill: #8250df; }
    .accent-soft { fill: #fbefff; }
    .accent-stroke { stroke: #8250df; }
    .good { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ink { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .line { stroke: #6e7681; }
      .chip { fill: #161b22; stroke: #30363d; }
      .accent { fill: #a371f7; }
      .accent-soft { fill: #271052; }
      .accent-stroke { stroke: #a371f7; }
      .good { fill: #3fb950; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <rect class="bg" width="1280" height="320" rx="16"/>

  <!-- Left: what today's session produced -->
  <text class="muted" x="64" y="62" font-size="15">today's session</text>
  <g transform="translate(64 78)">
    <rect class="chip" width="262" height="44" rx="10" stroke-width="1.5"/>
    <circle class="accent" cx="24" cy="22" r="6"/>
    <text class="ink mono" x="42" y="28" font-size="17">decisions &amp; fixes</text>
  </g>
  <g transform="translate(64 138)">
    <rect class="chip" width="262" height="44" rx="10" stroke-width="1.5"/>
    <circle class="accent" cx="24" cy="22" r="6"/>
    <text class="ink mono" x="42" y="28" font-size="17">commands that worked</text>
  </g>
  <g transform="translate(64 198)">
    <rect class="chip" width="262" height="44" rx="10" stroke-width="1.5"/>
    <circle class="accent" cx="24" cy="22" r="6"/>
    <text class="ink mono" x="42" y="28" font-size="17">your preferences</text>
  </g>

  <!-- Arrows in -->
  <g class="line" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M334 100 C 384 100, 404 160, 440 160"/>
    <path d="M334 160 L 440 160"/>
    <path d="M334 220 C 384 220, 404 160, 440 160"/>
  </g>

  <!-- Palace -->
  <g transform="translate(452 86)">
    <polygon class="accent" points="0,40 76,0 152,40"/>
    <polygon class="accent-soft" points="30,34 76,12 122,34"/>
    <rect class="accent" x="0" y="44" width="152" height="12" rx="2"/>
    <rect class="accent" x="14" y="62" width="18" height="62" rx="2"/>
    <rect class="accent" x="49" y="62" width="18" height="62" rx="2"/>
    <rect class="accent" x="85" y="62" width="18" height="62" rx="2"/>
    <rect class="accent" x="120" y="62" width="18" height="62" rx="2"/>
    <rect class="accent" x="0" y="128" width="152" height="10" rx="2"/>
    <rect class="accent" x="-10" y="142" width="172" height="8" rx="2"/>
  </g>
  <text class="muted mono" x="528" y="266" font-size="14" text-anchor="middle">palace.db</text>

  <!-- Arrow out -->
  <path class="line" d="M624 160 L 676 160" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path class="line" d="M668 153 L 677 160 L 668 167" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Next session -->
  <text class="muted" x="686" y="122" font-size="15">remembers</text>
  <g transform="translate(686 138)">
    <rect class="chip" width="176" height="44" rx="10" stroke-width="1.5"/>
    <circle class="good" cx="24" cy="22" r="6"/>
    <text class="ink mono" x="42" y="28" font-size="17">next session</text>
  </g>

  <!-- Title -->
  <text class="ink" x="912" y="150" font-size="64" font-weight="700">palace</text>
  <text class="muted" x="914" y="186" font-size="20">Local-first memory</text>
  <text class="muted" x="914" y="212" font-size="20">for coding agents</text>
</svg>
