<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">palace social preview</title>
  <desc id="desc">palace: local-first memory for coding agents. Verbatim, local, cited. Works with Claude Code, Codex, Cursor and Claude Desktop.</desc>
  <defs>
    <radialGradient id="glow" cx="0.27" cy="0.48" r="0.6">
      <stop offset="0" stop-color="#8957e5" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <rect width="1280" height="640" fill="#0d1117"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Palace -->
  <g transform="translate(176 170) scale(1.75)" fill="#a371f7">
    <polygon points="0,40 76,0 152,40"/>
    <polygon points="30,34 76,12 122,34" fill="#271052"/>
    <rect x="0" y="44" width="152" height="12" rx="2"/>
    <rect x="14" y="62" width="18" height="62" rx="2"/>
    <rect x="49" y="62" width="18" height="62" rx="2"/>
    <rect x="85" y="62" width="18" height="62" rx="2"/>
    <rect x="120" y="62" width="18" height="62" rx="2"/>
    <rect x="0" y="128" width="152" height="10" rx="2"/>
    <rect x="-10" y="142" width="172" height="8" rx="2"/>
  </g>

  <!-- Words -->
  <text x="560" y="262" font-size="112" font-weight="700" fill="#e6edf3">palace</text>
  <text x="566" y="322" font-size="34" fill="#c9d1d9">Local-first memory for coding agents</text>
  <text x="566" y="370" font-size="26" fill="#9198a1">Verbatim · local · cited · one SQLite file</text>

  <!-- Client chips -->
  <g class="mono" font-size="20" fill="#e6edf3">
    <rect x="566" y="420" width="160" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="646" y="449" text-anchor="middle">Claude Code</text>
    <rect x="738" y="420" width="100" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="788" y="449" text-anchor="middle">Codex</text>
    <rect x="850" y="420" width="108" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="904" y="449" text-anchor="middle">Cursor</text>
    <rect x="970" y="420" width="190" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="1065" y="449" text-anchor="middle">Claude Desktop</text>
  </g>

  <text class="mono" x="566" y="540" font-size="20" fill="#6e7681">github.com/AncientiCe/palace-rs</text>
</svg>
